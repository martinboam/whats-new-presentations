name: Update latest presentation links

on:
  release:
    types: [published, edited, deleted, unpublished, released]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: presentation-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
      - name: Refresh README shortcuts from published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/update-readme.mjs
